<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Favicon: the same bikini-top mark as components/ui/BikiniMark.js, on the page
    colour. The plate is there because a tab strip can be light or dark and a
    bare orange mark on white loses its edges; #0e0e0e is the site background, so
    the icon reads as a chip of the page.

    Kept in sync by hand - two files rather than one because a React component
    cannot be served as /icon.svg, and generating it at build time would mean
    pulling in next/og for a 500-byte image.
  -->
  <defs>
    <linearGradient id="g" x1="30" y1="16" x2="2" y2="16" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fc9918"/>
      <stop offset="1" stop-color="#fbf46d"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7" fill="#0e0e0e"/>

  <g transform="translate(16 16.6) scale(0.82) translate(-16 -16)">
    <path d="M2.6 10.4C6 13.2 10.5 14.7 16 14.7s10-1.5 13.4-4.3"
          stroke="url(#g)" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    <path d="M14.1 15.4H4.3c-.9 0-1.5.9-1.1 1.7 1.4 3.1 3.6 5.6 6.4 6.9 1.6.8 3.4-.5 3.4-2.3v-5.2c0-.6-.3-1.1-.9-1.1Z"
          fill="url(#g)"/>
    <path d="M17.9 15.4h9.8c.9 0 1.5.9 1.1 1.7-1.4 3.1-3.6 5.6-6.4 6.9-1.6.8-3.4-.5-3.4-2.3v-5.2c0-.6.3-1.1.9-1.1Z"
          fill="url(#g)"/>
  </g>
</svg>
